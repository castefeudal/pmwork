name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: tested-site-${{ github.sha }}
          path: out
      - name: Verify artifact commit before publishing
        run: node -e "const r=require('./out/release.json');const e=require('./out/quality-evidence.json');if(r.commit!==process.env.GITHUB_SHA||e.commit!==r.commit)throw Error('Artifact commit mismatch')"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify live release and assets
        run: node scripts/live-check.mjs
        env:
          PMWORK_LIVE_URL: https://castefeudal.github.io/pmwork/
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
