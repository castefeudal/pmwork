name: Quality gate
on:
  push:
    branches: ["build/**"]
  pull_request:
  workflow_call:
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        base: [root, github]
    env:
      PMWORK_BASE_PATH: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Preserve Chromium browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-qa-${{ matrix.base }}
          path: |
            test-results
            playwright-report
          retention-days: 7
          if-no-files-found: warn
      - name: Install Firefox and WebKit for root smoke matrix
        if: matrix.base == 'root'
        run: npx playwright install --with-deps firefox webkit
      - name: Cross-browser smoke
        if: matrix.base == 'root'
        run: npm run test:cross-browser
      - run: npm run performance:check
      - run: npm run evidence:release
      - name: Preserve exact-commit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ matrix.base }}-${{ github.sha }}
          path: quality-evidence
          retention-days: 30
      - name: Preserve tested GitHub Pages export
        if: matrix.base == 'github'
        uses: actions/upload-artifact@v7
        with:
          name: tested-site-${{ github.sha }}
          path: out
          retention-days: 7
