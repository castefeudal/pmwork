name: Quality gate
on:
  push:
    branches: ["build/**"]
  pull_request:
  workflow_call:
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        base: [root, github]
    env:
      PMWORK_BASE_PATH: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify
        id: source
      - run: npx playwright install --with-deps chromium
      - run: npm run lighthouse:check
        id: lighthouse
      - name: Preserve Lighthouse diagnostics
        if: ${{ !cancelled() && steps.lighthouse.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-${{ matrix.base }}-${{ github.sha }}
          path: quality-evidence/lighthouse
          retention-days: 30
          if-no-files-found: warn
      # Independent browser checks still collect evidence after a Lighthouse failure.
      # The failed Lighthouse step continues to fail this required job; release is blocked.
      - run: npm run test:e2e
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
      - name: Preserve Chromium browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-qa-${{ matrix.base }}
          path: |
            test-results
            playwright-report
          retention-days: 7
          if-no-files-found: warn
      - name: Install Firefox and WebKit
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: npx playwright install --with-deps firefox webkit
      - name: Cross-browser smoke
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: npm run test:cross-browser
      - run: npm run performance:check
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
      - run: npm run evidence:release
      - name: Preserve exact-commit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ matrix.base }}-${{ github.sha }}
          path: quality-evidence
          retention-days: 30
      - name: Preserve tested GitHub Pages export
        if: matrix.base == 'github'
        uses: actions/upload-artifact@v7
        with:
          name: tested-site-${{ github.sha }}
          path: out
          retention-days: 7
