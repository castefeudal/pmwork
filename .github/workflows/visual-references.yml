name: Review visual references
on:
  workflow_dispatch:
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        base: [root, github]
    env:
      PMWORK_BASE_PATH: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run lighthouse:check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: atlas-lighthouse-${{ matrix.base }}
          path: quality-evidence/lighthouse
          retention-days: 7
